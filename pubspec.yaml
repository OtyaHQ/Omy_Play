name: omy_play
description: Omy Play — a private, reliable Android media experience for video, music, transfer, files and local tools.
publish_to: 'none'
version: 1.1.0+8

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Media Playback — media_kit is the single engine for audio + video.
  # Android release builds are temporarily pinned to the reviewed upstream
  # disposal-order fix from media-kit PR #1424. That immutable revision keeps
  # the NativeCallable alive until mpv_terminate_destroy completes, preventing
  # the SIGABRT seen in Otya's Samsung Android 16 bug report. Replace this pin
  # only after upstream ships an equivalent production fix.
  media_kit:
    git:
      url: https://github.com/Priyanshu-Mallick/media-kit.git
      ref: 9e1706898f15bcee98c125a2f4a7b88a4374dda7
      path: media_kit
  media_kit_video: ^1.2.5
  media_kit_libs_android_video: ^1.3.2

  # Omy Play's first-party Android media tools.
  otya_media_tools:
    path: packages/otya_media_tools

  # Omy Play's first-party local transfer bridge.
  otya_transfer_android:
    path: packages/otya_transfer_android

  # Remote/Anywhere Together transport candidate. Keep this pinned on the
  # isolated size-budget path until native libwebrtc passes release gates.
  flutter_webrtc: 1.6.1

  hive: ^2.2.3
  hive_flutter: ^1.1.0
  crypto: ^3.0.5
  local_auth: ^2.3.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.0
  http: ^1.2.2
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.4.0
  go_router: ^14.6.0
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  google_sign_in: ^6.2.1
  device_info_plus: ^10.1.0
  package_info_plus: ^8.1.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  flutter_local_notifications: ^18.0.1
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  firebase_app_check: ^0.3.2+10
  firebase_analytics: ^11.6.0
  firebase_performance: ^0.10.1+10
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.1.4
  uuid: ^4.5.1
  json_annotation: ^4.9.0
  cupertino_icons: ^1.0.8
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.5
  audio_service: ^0.18.15
  audio_session: ^0.2.4
  webview_flutter: 4.9.0
  webview_flutter_android: 3.16.9

dependency_overrides:
  media_kit:
    git:
      url: https://github.com/Priyanshu-Mallick/media-kit.git
      ref: 9e1706898f15bcee98c125a2f4a7b88a4374dda7
      path: media_kit

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
    - assets/onboarding/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
        - asset: assets/fonts/Inter-Italic-VariableFont_opsz,wght.ttf
          style: italic
