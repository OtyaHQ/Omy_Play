name: Deploy isolated Omy Play staging API

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY-STAGING to redeploy the isolated Omy Play staging API'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: omy-play-api-staging
  cancel-in-progress: false

jobs:
  deploy-omy-play-staging:
    name: Validate and redeploy Omy Play staging API
    if: github.ref == 'refs/heads/omy-play-backend-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          package-manager-cache: false

      - name: Require explicit staging authority
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN_STAGING: ${{ secrets.CLOUDFLARE_API_TOKEN_STAGING }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = 'DEPLOY-STAGING' || {
            echo 'ERROR: staging deployment requires DEPLOY-STAGING'
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN_STAGING"

      - name: Run Omy Play backend tests and syntax check
        working-directory: backend/worker
        run: |
          set -euo pipefail
          node --check src/index.mjs
          npm test

      - name: Dry-run Omy Play staging Worker
        working-directory: backend/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_STAGING }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.159.0 deploy --dry-run --config wrangler.toml

      - name: Require deployed Otya ID staging service before product cutover
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN_STAGING: ${{ secrets.CLOUDFLARE_API_TOKEN_STAGING }}
          SETTINGS_FILE: ${{ runner.temp }}/otya-id-staging-settings.json
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN_STAGING"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/otya-id-staging/settings"             -o "$SETTINGS_FILE"
          node - "$SETTINGS_FILE" <<'NODE'
          const fs = require('node:fs');
          const response = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (response.success !== true || !response.result) {
            throw new Error('Otya ID staging Worker is not deployed or cannot be read');
          }
          NODE

      - name: Deploy Omy Play staging Worker with isolated identity binding
        working-directory: backend/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_STAGING }}
        run: |
          set -euo pipefail
          # Do not provide a secrets file: the existing FCM_TOKEN_ENCRYPTION_KEY
          # is an independent staging secret and must remain attached to this Worker.
          npx --yes wrangler@4.159.0 deploy --config wrangler.toml

      - name: Verify deployed Omy Play identity binding
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN_STAGING: ${{ secrets.CLOUDFLARE_API_TOKEN_STAGING }}
          SETTINGS_FILE: ${{ runner.temp }}/omy-play-api-staging-settings.json
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN_STAGING"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/omy-play-api-staging/settings"             -o "$SETTINGS_FILE"
          node - "$SETTINGS_FILE" <<'NODE'
          const fs = require('node:fs');
          const response = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const binding = response.result?.bindings?.find(item => item.name === 'OTYA_ID');
          if (response.success !== true || binding?.type !== 'service' || binding.service !== 'otya-id-staging') {
            throw new Error('Omy Play staging is not bound to Otya ID staging');
          }
          console.log('Omy Play staging identity binding verified.');
          NODE
