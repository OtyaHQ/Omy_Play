name: Guard Otya release candidate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate_identity:
    name: Verify next public build identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout with release tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect release-relevant changes in pull requests
        id: release_changes
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -Eq '^(lib/|android/|pubspec\.yaml$|pubspec\.lock$|assets/|scripts/verify-(release-candidate-version|play-publication-contract|android-release-apk)\.sh$|\.github/workflows/(release|release-apk|play-closed-test|release-mode-validation)\.yml$)'; then
            echo "release_relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require a new immutable build number
        if: github.event_name != 'pull_request' || steps.release_changes.outputs.release_relevant == 'true'
        shell: bash
        run: bash scripts/verify-release-candidate-version.sh

      - name: Verify Play and privacy publication contract
        if: github.event_name != 'pull_request' || steps.release_changes.outputs.release_relevant == 'true'
        shell: bash
        run: bash scripts/verify-play-publication-contract.sh

      - name: Check publication contract files exist
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/PRIVACY_POLICY.md
          test -s docs/OTYA_V1_FEATURE_PARITY.md
          test -s docs/SYSTEM_TRUTH_AUDIT.md
          test -s scripts/verify-android-release-apk.sh
          test -s .github/workflows/release-mode-validation.yml
          test -s .github/workflows/play-closed-test.yml
          test -s .github/workflows/release.yml
