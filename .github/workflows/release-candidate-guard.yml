name: Guard Otya release candidate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate_identity:
    name: Verify next public build identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout with release tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a new immutable build number for release-impacting changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            bash scripts/verify-release-candidate-version.sh
            exit 0
          fi
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No comparable base commit; enforce release candidate identity."
            bash scripts/verify-release-candidate-version.sh
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if printf '%s\\n' "$changed" | grep -Eq '^(android/|lib/|assets/|pubspec\\.yaml$|pubspec\\.lock$|scripts/verify-android-release-apk\\.sh$|\\.github/workflows/(release|release-apk|release-mode-validation|play-closed-test)\\.yml$)'; then
            bash scripts/verify-release-candidate-version.sh
          else
            echo "No release-impacting files changed; immutable build number check is not applicable."
          fi

      - name: Verify Play and privacy publication contract
        shell: bash
        run: bash scripts/verify-play-publication-contract.sh

      - name: Check publication contract files exist
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/PRIVACY_POLICY.md
          test -s docs/OTYA_V1_FEATURE_PARITY.md
          test -s docs/SYSTEM_TRUTH_AUDIT.md
          test -s scripts/verify-android-release-apk.sh
          test -s .github/workflows/release-mode-validation.yml
          test -s .github/workflows/play-closed-test.yml
          test -s .github/workflows/release.yml
