name: Omy Play backend CI
on:
  pull_request:
    paths:
      - "backend/**"
      - "wrangler.omy-play-staging.toml"
      - ".github/workflows/omy-play-backend-ci.yml"
  push:
    branches: [main, omy-play-backend-foundation]
    paths:
      - "backend/**"
      - "wrangler.omy-play-staging.toml"
      - ".github/workflows/omy-play-backend-ci.yml"
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Syntax check
        run: npm --prefix backend run check
      - name: Contract tests
        run: npm --prefix backend test
      - name: Schema snapshot validation
        run: npm --prefix backend run verify:schema
