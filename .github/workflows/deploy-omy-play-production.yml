name: Deploy Omy Play production API

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY-OMY-PLAY-PRODUCTION to deploy the production API'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: omy-play-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, deploy and verify Omy Play
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY-OMY-PLAY-PRODUCTION'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          package-manager-cache: false

      - name: Validate source, contracts and schema
        run: |
          set -euo pipefail
          npm --prefix backend run check
          npm --prefix backend test
          npm --prefix backend run verify:schema

      - name: Require production deployment credentials
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Dry-run the production Worker configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.159.0 deploy --dry-run --config wrangler.omy-play-production.toml

      - name: Deploy Omy Play production API
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.159.0 deploy --config wrangler.omy-play-production.toml

      - name: Verify production Worker bindings and encryption secret
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/omy-play"
          settings="$(curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/settings")"
          secrets="$(curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/secrets")"
          node - "$settings" "$secrets" <<'NODE'
          const settings = JSON.parse(process.argv[2]);
          const secrets = JSON.parse(process.argv[3]);
          const bindings = settings.result?.bindings ?? [];
          const names = new Set(bindings.map(item => item.name));
          const secretNames = new Set((secrets.result ?? []).map(item => item.name));
          const required = ['DB', 'ASSETS', 'OID', 'PRODUCT_CODE', 'APP_PACKAGE_ID', 'PUBLIC_API_BASE_URL'];
          for (const name of required) if (!names.has(name)) throw new Error('Missing production binding: ' + name);
          const id = bindings.find(item => item.name === 'OID');
          if (id?.type !== 'service' || id.service !== 'oid') throw new Error('Omy Play must use the OEnd identity service');
          if (!secretNames.has('FCM_TOKEN_ENCRYPTION_KEY')) throw new Error('Production FCM token encryption secret is missing');
          if (settings.result?.workers_dev !== false) throw new Error('Production Worker must remain private');
          NODE

      - name: Smoke test the production API
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.otya.site/omy-play"
          health="$(curl --retry 3 --retry-delay 2 --retry-all-errors --max-time 25 -fsS "$base/health")"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.service!=="Omy Play" || x.status!=="ready" || x.schemaReady!==true || x.aiEnabled!==false) process.exit(1)' "$health"
          config="$(curl --max-time 20 -fsS "$base/api/app-config")"
          themes="$(curl --max-time 20 -fsS "$base/api/themes")"
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.config || typeof x.config!=="object") process.exit(1)' "$config"
          node -e 'const x=JSON.parse(process.argv[1]); if(!Array.isArray(x.themes)) process.exit(1)' "$themes"
          status="$(curl --max-time 20 -sS -o /tmp/omy-protected.json -w '%{http_code}' "$base/v1/notifications")"
          test "$status" = "401"
