# Isolated Omy Play staging Worker. Not a production manifest.
name = "omy-play-api-staging"
main = "src/index.mjs"
compatibility_date = "2026-11-11"
workers_dev = false
keep_vars = true

[vars]
ENVIRONMENT = "staging"
PRODUCT_CODE = "OMY_PLAY"
APP_PACKAGE_ID = "com.otya.omyplay"
FIREBASE_PROJECT_ID = "omyplay-otya-prod"

[[d1_databases]]
binding = "DB"
database_name = "omy-play-staging-db"
database_id = "006b1ac1-0e92-4480-b07e-4232724710e8"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "omy-play-staging-assets"

# Dedicated identity dependency: Otya ID staging. Do not bind to production identity in staging.
[[services]]
binding = "OTYA_ID"
service = "otya-id-staging"

# FCM_TOKEN_ENCRYPTION_KEY is an out-of-band Worker secret.
# No FCM Admin service credential is configured in staging.
[observability]
enabled = true
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = true
persist = true
head_sampling_rate = 1

[observability.traces]
enabled = false
head_sampling_rate = 0
